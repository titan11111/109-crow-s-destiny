<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CROW'S DESTINY: THE RITUAL OF TWILIGHT</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 縦向き時のみ表示：横画面でプレイするよう促す -->
<div id="portrait-message" class="portrait-message" aria-hidden="true">
    <p>横にしてください</p>
</div>

<div id="game-container">
    <div id="loading-screen">
        <h1>RITUAL INITIALIZING...</h1>
        <div class="altar-light"></div>
    </div>

    <!-- 左パネル: ジョイスティック（幅固定） -->
    <div id="left-panel" class="side-panel">
        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
    </div>

    <!-- 中央パネル: プレイ画面 -->
    <div id="center-panel">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 右パネル: アクションボタン（幅固定） -->
    <div id="right-panel" class="side-panel">
        <div id="action-buttons">
            <button id="btn-pause" type="button" aria-label="一時停止" title="一時停止">Ⅱ</button>
            <button id="btn-settings" type="button" aria-label="操作設定">設定</button>
            <button id="btn-dash" type="button" aria-label="ダッシュ">DASH</button>
            <button id="btn-start" type="button" aria-label="開始">START</button>
        </div>
    </div>
</div>
<div id="joystick-settings-overlay" class="settings-overlay" aria-hidden="true">
    <div class="settings-panel">
        <h2 class="settings-title">操作感度</h2>
        <div class="settings-row">
            <span class="settings-label">鈍感</span>
            <input type="range" id="joystick-sensitivity" min="0.5" max="2" step="0.1" value="1.0" aria-label="感度">
            <span class="settings-label">敏感</span>
        </div>
        <p class="settings-value">感度: <output id="out-sensitivity">1.0</output></p>
        <h2 class="settings-title">デッドゾーン</h2>
        <div class="settings-row">
            <span class="settings-label">小</span>
            <input type="range" id="joystick-deadzone" min="0" max="0.4" step="0.05" value="0.15" aria-label="デッドゾーン">
            <span class="settings-label">大</span>
        </div>
        <p class="settings-value">デッドゾーン: <output id="out-deadzone">0.15</output></p>
        <div class="settings-test-area" id="joystick-test-area">
            <span class="settings-test-label">テストエリア（ここでドラッグ）</span>
            <output id="out-test-xy" class="settings-test-out">X: 0.00  Y: 0.00</output>
        </div>
        <button type="button" id="btn-settings-back" class="settings-back">戻る</button>
    </div>
</div>
<!-- 左パネル用ジョイスティックの入力をゲームに渡すためのグローバル（ゲームループで参照） -->
<script>window.crowDestinyJoystick = { x: 0, y: 0 };</script>
<!-- 役割ごとの読み込み順（依存関係を満たす） -->
<script src="js/core/config.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/load/assets.js"></script>
<script src="js/audio/sound.js"></script>
<script src="js/render/anim.js"></script>
<script src="js/render/fx.js"></script>
<script src="js/render/background.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/entities/crow.js"></script>
<script src="js/entities/enemy.js"></script>
<script src="js/entities/obstacle.js"></script>
<script src="js/entities/boss.js"></script>
<script src="js/entities/relic.js"></script>
<script src="js/input/joystick.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
/* 左パネル DOM ジョイスティック + 縦向き時アナウンス */
(function () {
    var stick = document.getElementById('joystick-stick');
    var base = document.getElementById('joystick-base');
    var zone = document.getElementById('joystick-zone');
    var joy = window.crowDestinyJoystick;
    if (!joy) return;

    var joyActive = false;
    function updateStick(e) {
        e.preventDefault();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        var rect = base.getBoundingClientRect();
        var centerX = rect.left + rect.width / 2;
        var centerY = rect.top + rect.height / 2;
        var maxR = rect.width / 2;
        var dx = clientX - centerX;
        var dy = clientY - centerY;
        var dist = Math.hypot(dx, dy);
        if (dist > maxR) {
            var r = maxR / dist;
            dx *= r;
            dy *= r;
        }
        joy.x = dx / maxR;
        joy.y = dy / maxR;
        stick.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    }
    function joyEnd() {
        joyActive = false;
        joy.x = 0;
        joy.y = 0;
        stick.style.transform = 'translate(-50%, -50%)';
    }
    if (zone) {
        zone.addEventListener('touchstart', function (e) { joyActive = true; updateStick(e); }, { passive: false });
        zone.addEventListener('touchmove', function (e) { if (joyActive) updateStick(e); }, { passive: false });
        zone.addEventListener('touchend', joyEnd);
        zone.addEventListener('touchcancel', joyEnd);
        zone.addEventListener('mousedown', function (e) { joyActive = true; updateStick(e); });
    }
    window.addEventListener('mousemove', function (e) { if (joyActive) updateStick(e); });
    window.addEventListener('mouseup', joyEnd);

    /* 縦向きで「横にしてください」表示 */
    var portraitEl = document.getElementById('portrait-message');
    function checkOrientation() {
        if (!portraitEl) return;
        var isPortrait = window.matchMedia('(orientation: portrait)').matches;
        portraitEl.classList.toggle('is-visible', isPortrait);
        portraitEl.setAttribute('aria-hidden', isPortrait ? 'false' : 'true');
    }
    window.addEventListener('orientationchange', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    checkOrientation();
})();
</script>
</body>
</html>
